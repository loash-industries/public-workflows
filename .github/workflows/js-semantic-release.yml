---
name: Semantic Release

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version for actions/setup-node
        type: string
        required: true
      environment:
        description: GitHub environment
        required: false
        type: string
      npm_client:
        description: npm client to use (npm or yarn)
        type: string
        default: "yarn"
      npm_client_production_flag:
        description: Npm client production flag
        type: string
        required: false
        default: "--frozen-lockfile"
      yarn_version:
        description: yarn version (1 or 4)
        type: string
        default: "1"
        required: false
      npm_registry_url:
        type: string
        description: >-
          Deprecated and ignored. @semantic-release/npm publishes to
          publishConfig.registry in package.json, else the registry in .npmrc,
          else registry.npmjs.org, and writes NPM_TOKEN for that registry itself.
        default: "https://registry.npmjs.org"
        required: false
      npm_trusted_publishing:
        type: boolean
        description: >-
          Publish with npm trusted publishing (OIDC) instead of NPM_TOKEN. See
          the README for the npmjs.com and package.json setup it needs.
        default: false
        required: false
      npm_staged_publishing:
        type: boolean
        description: >-
          Stage each release on npm (`npm stage publish`) for a maintainer to
          approve with 2FA, instead of publishing it. Needs
          npm_trusted_publishing and `npmPublish: false` for
          @semantic-release/npm. See the README.
        default: false
        required: false
      build_output_path:
        type: string
        description: >-
          Directory the build writes, relative to working_directory. It is
          carried from the build job to the release job.
        default: "dist"
        required: false
      working_directory:
        type: string
        description: Working directory for running commands (e.g., for monorepos)
        default: "."
        required: false
    secrets:
      GH_AUTH_TOKEN:
        description: GitHub token for creating releases, tags, and updating CHANGELOG
        required: true
      NPM_TOKEN:
        description: >-
          npm token for publishing. Required unless npm_trusted_publishing is
          true, in which case it is ignored.
        required: false

jobs:
  # Dependency install and build scripts run here, with a read-only token and
  # no OIDC token, so they can neither publish to npm nor push to the repo.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Base actions
        uses: loash-industries/public-workflows/.github/actions/node-base-actions@v0.1.0
        with:
          node_version: ${{ inputs.node_version }}
          npm_client: ${{ inputs.npm_client }}
          npm_client_production_flag: ${{ inputs.npm_client_production_flag }}
          node_modules_cache_key_prefix: node-modules-release
          yarn_version: ${{ inputs.yarn_version }}
          working_directory: ${{ inputs.working_directory }}

      - name: Build package
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.npm_client }} run build

      # Artifact names are unique per workflow run, so this one must differ
      # between two calls of this workflow from the same caller.
      - name: Name build output
        id: artifact
        run: echo "name=build-output-$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.working_directory }}/${{ inputs.build_output_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # For npm trusted publishing. A job's permissions can't depend on an
      # input, so callers must grant id-token: write even with NPM_TOKEN.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AUTH_TOKEN }}

      # Install scripts already ran in the build job. They are skipped here,
      # where they could mint an npm publish token.
      - name: Node Base actions
        uses: loash-industries/public-workflows/.github/actions/node-base-actions@v0.1.0
        env:
          npm_config_ignore_scripts: "true" # npm ci
          YARN_ENABLE_SCRIPTS: "false" # yarn 2+
        with:
          node_version: ${{ inputs.node_version }}
          npm_client: ${{ inputs.npm_client }}
          # yarn 1 and pnpm. yarn 2+ rejects the flag but never receives it.
          npm_client_production_flag: ${{ inputs.npm_client_production_flag }} --ignore-scripts
          node_modules_cache_key_prefix: node-modules-release
          yarn_version: ${{ inputs.yarn_version }}
          working_directory: ${{ inputs.working_directory }}

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ inputs.working_directory }}/${{ inputs.build_output_path }}

      - name: Check npm auth
        working-directory: ${{ inputs.working_directory }}
        env:
          TRUSTED_PUBLISHING: ${{ inputs.npm_trusted_publishing }}
          STAGED: ${{ inputs.npm_staged_publishing }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$STAGED" = "true" ] && [ "$TRUSTED_PUBLISHING" != "true" ]; then
            echo "::error::npm_staged_publishing needs npm_trusted_publishing: true."
            exit 1
          fi
          if [ "$TRUSTED_PUBLISHING" != "true" ]; then
            if [ -z "$NPM_TOKEN" ]; then
              echo "::error::NPM_TOKEN is empty. Pass it, or set npm_trusted_publishing: true to publish with npm trusted publishing (OIDC)."
              exit 1
            fi
            exit 0
          fi
          if [ "$STAGED" = "true" ]; then
            # semantic-release doesn't publish in this mode, so the checks
            # below don't apply. "Stage release on npm" uses its own npm.
            echo "Staging releases on npm with trusted publishing (OIDC)."
            exit 0
          fi

          # @semantic-release/npm only tries OIDC when the registry is exactly
          # this string, trailing slash included, and otherwise fails with
          # ENONPMTOKEN.
          official=https://registry.npmjs.org/
          registry=$(jq -r '.publishConfig.registry // empty' package.json)
          if [ -n "$registry" ] && [ "$registry" != "$official" ]; then
            echo "::error::Trusted publishing needs publishConfig.registry in package.json to be exactly $official (or unset), not $registry."
            exit 1
          fi

          # The plugin publishes with the first npm in node_modules/.bin (here
          # or in a parent directory), else the one next to node. That npm
          # exchanges the OIDC token again after the release tag is pushed, so
          # one without OIDC support would leave a tag with nothing published.
          bins=""
          dir=$PWD
          while [ "$dir" != / ]; do
            bins="$bins$dir/node_modules/.bin:"
            dir=$(dirname "$dir")
          done
          npm_version=$(PATH="$bins$(dirname "$(command -v node)"):$PATH" npm --version)
          if ! printf '11.5.1\n%s\n' "$npm_version" | sort -V -C; then
            echo "::error::Trusted publishing needs npm 11.5.1 or later, but semantic-release would publish with npm $npm_version. Use semantic-release 25 (@semantic-release/npm 13.1.0 or later)."
            exit 1
          fi
          echo "Publishing with npm trusted publishing (OIDC) using npm $npm_version."

      - name: Release
        working-directory: ${{ inputs.working_directory }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}
          # @semantic-release/npm writes this into a temporary .npmrc for the
          # registry it publishes to. It is withheld under trusted publishing,
          # so a token from the caller or an environment secret can't quietly
          # stand in if the OIDC exchange fails.
          NPM_TOKEN: ${{ !inputs.npm_trusted_publishing && secrets.NPM_TOKEN || '' }}
          STAGED: ${{ inputs.npm_staged_publishing }}
        run: |
          if [ "$STAGED" != "true" ]; then
            npx semantic-release
            exit 0
          fi
          # Without the OIDC request variables semantic-release can't get npm
          # credentials. If @semantic-release/npm isn't set to
          # `npmPublish: false`, it fails with ENONPMTOKEN before tagging
          # instead of publishing.
          echo "Staged publishing: @semantic-release/npm must have npmPublish: false. The next step stages the release."
          env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN npx semantic-release

      - name: Stage release on npm
        if: inputs.npm_staged_publishing
        working-directory: ${{ inputs.working_directory }}
        run: |
          # @semantic-release/npm writes the new version to package.json even
          # with npmPublish: false, so an unchanged version means no release.
          version=$(jq -r .version package.json)
          if [ "$version" = "$(git show "$GITHUB_SHA:./package.json" | jq -r .version)" ]; then
            echo "No new release, so there is nothing to stage."
            exit 0
          fi
          # npm needs the dist-tag spelled out for a prerelease. Like
          # semantic-release's channel, it is the identifier (beta in
          # 1.0.0-beta.2).
          tag=latest
          case "$version" in
            *-*) tag=${version#*-}; tag=${tag%%.*} ;;
          esac
          # The runner's npm predates `npm stage`.
          npm install -g npm@^11.21.1
          npm stage publish --tag "$tag" > "$RUNNER_TEMP/stage.out"
          cat "$RUNNER_TEMP/stage.out"

          # npm prints "+ <name>@<version> (staged with id <id>)". If that
          # changes, the summary falls back to `npm stage list`.
          name=$(jq -r .name package.json)
          id=$(sed -n 's/.*(staged with id \([^)]*\)).*/\1/p' "$RUNNER_TEMP/stage.out" | tail -n 1)
          if [ -n "$id" ]; then
            approve="npm stage approve $id"
          else
            approve="npm stage list $name   # then: npm stage approve <id>"
          fi
          echo "::notice::Staged $name@$version on npm. Approve it with 2FA to make it installable: $approve"
          fence='```'
          {
            echo "### $name@$version is staged on npm"
            echo
            echo "It isn't installable until a maintainer approves it with 2FA, with npm 11.21 or later or on [npmjs.com](https://www.npmjs.com/package/$name):"
            echo
            echo "${fence}sh"
            echo "$approve"
            echo "$fence"
            if [ -n "$id" ]; then
              echo
              echo "To check the tarball first: \`npm stage download $id\`. To discard it: \`npm stage reject $id\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
