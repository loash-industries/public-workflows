name: Lint & Audit GitHub Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install yamllint
        run: sudo pip install yamllint
      - name: Run yamllint
        run: |
          yamllint -d '{extends: default, rules: {line-length: {max: 160}}}' .github/workflows .github/actions || true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Find & lint embedded bash
        run: |
          tmpdir=$(mktemp -d)
          grep -RIn "run: |" -n .github/workflows .github/actions | cut -d: -f1 | sort -u | while read f; do
            awk '/run: \|/{flag=1;next}/^[^ ]/{flag=0}flag{print}' "$f" > "$tmpdir/$(basename $f).sh" || true
          done
          ls -1 "$tmpdir" | xargs -I{} sh -c 'echo Linting {} && shellcheck "$tmpdir/{}" || true'

  action-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate composite action metadata
        run: |
          find .github/actions -maxdepth 2 -name action.yml -print0 | while IFS= read -r -d '' file; do
            echo "Validating $file";
            grep -Eq '^name:' "$file" || echo "Missing name in $file";
            grep -Eq '^runs:' "$file" || echo "Missing runs section in $file";
          done

  # DEVOPS-30: every uses: here is pinned to a full commit SHA.
  sha-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fail on unpinned uses
        run: |
          set -euo pipefail
          bad=$(grep -RnE '^\s*-?\s*uses:\s*' .github/workflows .github/actions \
            | grep -vE 'uses:\s*["'"'"']?\./' \
            | grep -vE 'uses:\s*["'"'"']?docker://' \
            | grep -vE '@[0-9a-f]{40}([^0-9a-f]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Pin these to a full commit SHA (add the version as a comment):"
            echo "$bad"
            exit 1
          fi

