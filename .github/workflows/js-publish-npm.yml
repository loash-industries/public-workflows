---
name: Publish to public NPM Registry

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version for actions/setup-node
        type: string
        required: true
      environment:
        description: GitHub environment
        required: false
        type: string
      npm_client:
        description: npm client to use (npm or yarn)
        type: string
        default: "yarn"
      npm_client_production_flag:
        description: Npm client production flag
        type: string
        required: false
        default: "--frozen-lockfile"
      yarn_version:
        description: yarn version (1 or 4)
        type: string
        default: "1"
        required: false
      npm_registry_url:
        type: string
        description: NPM Registry URL for publishing
        default: "https://registry.npmjs.org"
        required: false
      access:
        type: string
        description: Package access level (public or restricted)
        default: "public"
        required: false
      npm_trusted_publishing:
        type: boolean
        description: >-
          Publish with npm trusted publishing (OIDC) instead of
          TRINARYEX_NPM_TOKEN. See the README for the npmjs.com setup it needs.
        default: false
        required: false
      build_output_path:
        type: string
        description: >-
          Directory the build writes, relative to working_directory. It is
          carried from the build job to the publish job.
        default: "dist"
        required: false
      working_directory:
        type: string
        description: Working directory for running commands (e.g., for monorepos)
        default: "."
        required: false
    secrets:
      TRINARYEX_NPM_TOKEN:
        description: >-
          npm token for publishing to npmjs.org. Required unless
          npm_trusted_publishing is true, in which case it is ignored.
        required: false

jobs:
  # Dependency install and build scripts run here, with a read-only token and
  # no OIDC token, so they can't publish to npm.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node Base actions
        uses: loash-industries/public-workflows/.github/actions/node-base-actions@ccf853269790fd54ddcaafc4f5d3d7a0571b36f4 # v0.1.0
        with:
          node_version: ${{ inputs.node_version }}
          npm_client: ${{ inputs.npm_client }}
          npm_client_production_flag: ${{ inputs.npm_client_production_flag }}
          node_modules_cache_key_prefix: node-modules-publish
          yarn_version: ${{ inputs.yarn_version }}
          working_directory: ${{ inputs.working_directory }}

      - name: Build package
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.npm_client }} run build

      # Artifact names are unique per workflow run, so this one must differ
      # between two calls of this workflow from the same caller.
      - name: Name build output
        id: artifact
        run: echo "name=build-output-$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.working_directory }}/${{ inputs.build_output_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [build]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For npm trusted publishing. A job's permissions can't depend on an
      # input, so callers must grant id-token: write even with a token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Install scripts already ran in the build job. They are skipped here,
      # where they could mint an npm publish token. The package's own
      # prepublish/prepack scripts still run during `npm publish`.
      - name: Node Base actions
        uses: loash-industries/public-workflows/.github/actions/node-base-actions@ccf853269790fd54ddcaafc4f5d3d7a0571b36f4 # v0.1.0
        env:
          npm_config_ignore_scripts: "true" # npm ci
          YARN_ENABLE_SCRIPTS: "false" # yarn 2+
        with:
          node_version: ${{ inputs.node_version }}
          npm_client: ${{ inputs.npm_client }}
          # yarn 1 and pnpm. yarn 2+ rejects the flag but never receives it.
          npm_client_production_flag: ${{ inputs.npm_client_production_flag }} --ignore-scripts
          node_modules_cache_key_prefix: node-modules-publish
          yarn_version: ${{ inputs.yarn_version }}
          working_directory: ${{ inputs.working_directory }}

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ inputs.working_directory }}/${{ inputs.build_output_path }}

      - name: Configure npm auth
        env:
          TRUSTED_PUBLISHING: ${{ inputs.npm_trusted_publishing }}
          NPM_TOKEN: ${{ secrets.TRINARYEX_NPM_TOKEN }}
        run: |
          if [ "$TRUSTED_PUBLISHING" = "true" ]; then
            # npm exchanges the OIDC token itself from 11.5.1 on. The runner's
            # npm is older for Node 22.
            npm install -g npm@^11.5.1
            exit 0
          fi
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::TRINARYEX_NPM_TOKEN is empty. Pass it, or set npm_trusted_publishing: true to publish with npm trusted publishing (OIDC)."
            exit 1
          fi
          # Kept outside the checkout so the token can't end up in the package
          # or the repo. npm reads ${NODE_AUTH_TOKEN} from the environment.
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/.npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc" >> "$GITHUB_ENV"

      - name: Publish to NPM
        working-directory: ${{ inputs.working_directory }}
        run: npm publish --access "$ACCESS"
        env:
          ACCESS: ${{ inputs.access }}
          NODE_AUTH_TOKEN: ${{ !inputs.npm_trusted_publishing && secrets.TRINARYEX_NPM_TOKEN || '' }}
